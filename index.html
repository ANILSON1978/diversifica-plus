
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Investimentos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #0056b3;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }
    button:hover {
      background-color: #003d82;
    }
    #parecer-container {
      margin-top: 25px;
      padding: 15px;
      border: 1px solid #c3e6cb;
      border-radius: 8px;
      background-color: #d4edda;
      color: #155724;
      display: none; /* Inicia oculto até a simulação ser feita */
    }
    #parecer-container h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>

  <h2>Simulador de Títulos Privados com Cupons Semestrais</h2>

  <div class="form-group">
    <label for="valor">Valor do Investimento (R$):</label>
    <input type="number" id="valor" value="10000" placeholder="Ex: 10000">
  </div>

  <div class="form-group">
    <label for="prazo">Prazo (Meses):</label>
    <input type="number" id="prazo" value="24" placeholder="Ex: 24">
  </div>

  <div class="form-group">
    <label for="taxaPre">Taxa Pré-fixada (% a.a.):</label>
    <input type="number" id="taxaPre" step="0.1" value="12" placeholder="Ex: 12">
  </div>

  <div class="form-group">
    <label for="cdi">CDI (% a.a.):</label>
    <input type="number" id="cdi" step="0.1" value="10.5" placeholder="Ex: 10.5">
  </div>

  <div class="form-group">
    <label for="taxaPos">Spread Pós-fixado / Adicional (% a.a.):</label>
    <input type="number" id="taxaPos" step="0.1" value="1.5" placeholder="Ex: 1.5">
  </div>

  <button onclick="executarSimulacao()">Simular e Gerar Parecer</button>

  <!-- SEÇÃO DO PARECER DINÂMICO -->
  <div id="parecer-container">
    <h3>Parecer do Especialista</h3>
    <ul style="padding-left: 20px; line-height: 1.6;">
      <li><strong>Melhor Rentabilidade Líquida:</strong> A opção <span id="parecer-melhor-opcao">-</span> se destaca com o maior retorno final, totalizando <span id="parecer-valor-final">R$ 0,00</span>.</li>
      <li><strong>Veredito:</strong> Para maximizar seus ganhos no período simulado, a opção <span id="parecer-recomendada">-</span> é a alternativa mais vantajosa.</li>
    </ul>
  </div>

  <script>
    // --- 1. FUNÇÃO PARA ATUALIZAR O PARECER NO HTML ---
    function atualizarParecer(nomeMelhorOpcao, valorFinalFormatado) {
      document.getElementById('parecer-melhor-opcao').textContent = nomeMelhorOpcao;
      document.getElementById('parecer-valor-final').textContent = valorFinalFormatado;
      document.getElementById('parecer-recomendada').textContent = nomeMelhorOpcao;
      document.getElementById('parecer-container').style.display = 'block';
    }

    // --- 2. CÁLCULO DE TÍTULO PRIVADO PRÉ-FIXADO COM CUPOM SEMESTRAL ---
    function calcularTituloPreComCupom(valorInicial, taxaAnual, prazoMeses) {
      const taxaSemestral = Math.pow(1 + taxaAnual / 100, 0.5) - 1;
      const numSemestres = Math.floor(prazoMeses / 6);
      let totalCuponsAcumulados = 0;

      for (let i = 1; i <= numSemestres; i++) {
        const valorCupomBruto = valorInicial * taxaSemestral;
        
        // Tabela regressiva de IR
        const mesesDecorridos = i * 6;
        let aliquotaIR = 0.15;
        if (mesesDecorridos <= 6) aliquotaIR = 0.225;
        else if (mesesDecorridos <= 12) aliquotaIR = 0.20;
        else if (mesesDecorridos <= 24) aliquotaIR = 0.175;

        const valorCupomLiquido = valorCupomBruto * (1 - aliquotaIR);
        totalCuponsAcumulados += valorCupomLiquido;
      }

      const valorFinalTotal = valorInicial + totalCuponsAcumulados;
      
      return {
        tipo: "Título Privado Pré-fixado (com Cupons)",
        valorFinal: valorFinalTotal
      };
    }

    // --- 3. CÁLCULO DE TÍTULO PRIVADO PÓS-FIXADO (CDI + TAXA) COM CUPOM SEMESTRAL ---
    function calcularTituloPosComCupom(valorInicial, cdiAnual, taxaAdicional, prazoMeses) {
      const taxaTotalAnual = (1 + cdiAnual / 100) * (1 + taxaAdicional / 100) - 1;
      const taxaSemestral = Math.pow(1 + taxaTotalAnual, 0.5) - 1;
      const numSemestres = Math.floor(prazoMeses / 6);
      let totalCuponsAcumulados = 0;

      for (let i = 1; i <= numSemestres; i++) {
        const valorCupomBruto = valorInicial * taxaSemestral;
        
        // Tabela regressiva de IR
        const mesesDecorridos = i * 6;
        let aliquotaIR = 0.15;
        if (mesesDecorridos <= 6) aliquotaIR = 0.225;
        else if (mesesDecorridos <= 12) aliquotaIR = 0.20;
        else if (mesesDecorridos <= 24) aliquotaIR = 0.175;

        const valorCupomLiquido = valorCupomBruto * (1 - aliquotaIR);
        totalCuponsAcumulados += valorCupomLiquido;
      }

      const valorFinalTotal = valorInicial + totalCuponsAcumulados;

      return {
        tipo: "Título Privado Pós-fixado (com Cupons)",
        valorFinal: valorFinalTotal
      };
    }

    // --- 4. FUNÇÃO PRINCIPAL DE SIMULAÇÃO ---
    function executarSimulacao() {
      // Coleta dos valores informados nos campos do formulário
      const valor = parseFloat(document.getElementById('valor').value) || 0;
      const prazo = parseInt(document.getElementById('prazo').value) || 0;
      const taxaPre = parseFloat(document.getElementById('taxaPre').value) || 0;
      const cdi = parseFloat(document.getElementById('cdi').value) || 0;
      const taxaPos = parseFloat(document.getElementById('taxaPos').value) || 0;

      // Realiza os dois cálculos
      const resultadoPre = calcularTituloPreComCupom(valor, taxaPre, prazo);
      const resultadoPos = calcularTituloPosComCupom(valor, cdi, taxaPos, prazo);

      // Identifica a melhor opção
      const melhorOpcao = resultadoPre.valorFinal > resultadoPos.valorFinal ? resultadoPre : resultadoPos;

      // Formata o resultado para moeda brasileira
      const valorFormatado = melhorOpcao.valorFinal.toLocaleString('pt-BR', { 
        style: 'currency', 
        currency: 'BRL' 
      });

      // Atualiza a interface
      atualizarParecer(melhorOpcao.tipo, valorFormatado);
    }
  </script>
</body>
</html>
